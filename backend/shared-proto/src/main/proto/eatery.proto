syntax = "proto3";

package com.salob.proto.eatery;

option java_multiple_files = true;
option java_package = "com.salob.proto.eatery";

message EateryRequest {
  string eatery_id = 1;
}

message EateryResponse {
  string id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
}

//--------------------------------
message NearbyEateriesRequest {
  string location = 1;
}

message NearbyEatery {
  string id = 1;
  string name = 2;
  string address = 3;
}

message NearbyEateriesResponse {
  repeated NearbyEatery eateries = 1;
}

//--------------------------------
service EateryService {
  rpc GetEatery(EateryRequest) returns (EateryResponse);
  rpc GetNearbyEateries(NearbyEateriesRequest) returns (NearbyEateriesResponse);
}
