syntax = "proto3";

package com.salob.proto.foodEntry;

option java_multiple_files = true;
option java_package = "com.salob.proto.foodEntry";

message ConsensusFoodEntryRequest {
  string food_name = 1;
  string eatery_name = 2;
}

message ConsensusFoodEntryResponse {
  int32 sg_cents = 1;
}

//--------------------------------
service FoodEntryService {
  rpc GetConsensusFoodEntry(ConsensusFoodEntryRequest) returns (ConsensusFoodEntryResponse);
}
