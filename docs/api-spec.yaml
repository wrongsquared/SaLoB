openapi: "3.0.3"
info:
  title: SaLoB API
  description: |
    Crowdsourced Price Intelligence Platform API.
    All endpoints are behind an API gateway that routes to individual services.
    The API gateway adds `X-User-Id`, `X-User-Name`, and `X-User-Roles` headers
    after JWT authentication.
  version: "1.0.0"
  contact:
    name: SaLoB Team

servers:
  - url: /api
    description: API gateway base path

paths:
  # ─── Eateries ──────────────────────────────────────────────
  /eateries/within-bounds:
    get:
      summary: Fetch eateries within a bounding box
      description: >
        Returns lightweight eatery markers for the visible map viewport.
        Results are cached using coordinate bucketing.
      tags: [Eateries]
      parameters:
        - name: minLat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: maxLat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: minLon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: maxLon
          in: query
          required: true
          schema: { type: number, format: double }
      responses:
        "200":
          description: List of eateries within bounds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EateryMapItem"
        "400":
          description: Invalid bounds (min >= max)

  /eateries/{eateryId}:
    get:
      summary: Fetch full details for a single eatery
      description: Used by the sidebar panel when a user clicks a map marker.
      tags: [Eateries]
      parameters:
        - name: eateryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Eatery details with food previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EateryDetail"
        "404":
          description: Eatery not found

  /eateries/search:
    get:
      summary: Search eateries by name
      description: Autocomplete search for the search bar.
      tags: [Eateries]
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching eateries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaterySearchResult"
        "204":
          description: No matches found

  /eateries/search/combined:
    get:
      summary: Search eateries (local DB + OneMap)
      description: Returns local eateries and OneMap results. OneMap results have no eateryId — frontend sends a create request when user selects one.
      tags: [Eateries]
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Combined search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaterySearchCombinedResult"

  /eatery-types:
    get:
      summary: List all eatery types
      description: Returns the available eatery categories (Hawker Stall, Cafe, etc.).
      tags: [Eateries]
      responses:
        "200":
          description: Available eatery types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EateryType"

  /eateries:
    post:
      summary: Create a new eatery from OneMap data
      description: Creates an eatery in the local DB from OneMap search result data. Returns the created eatery with its generated ID.
      tags: [Eateries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEateryRequest"
      responses:
        "200":
          description: Eatery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaterySearchResult"

  /eateries/{eateryId}/report-closed:
    post:
      summary: Report an eatery as permanently closed
      tags: [Eateries]
      parameters:
        - name: eateryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      headers:
        X-User-Id:
          schema: { type: string, format: uuid }
          required: true
      responses:
        "204":
          description: Successfully reported
        "409":
          description: Already reported

  # ─── Foods ─────────────────────────────────────────────────
  /foods/search:
    get:
      summary: Search foods by name
      tags: [Foods]
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching foods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodSearchResult"

  /foods:
    post:
      summary: Create a new food item (idempotent)
      description: Returns existing food if name already exists.
      tags: [Foods]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodCreationRequest"
      responses:
        "200":
          description: Created or existing food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSearchResult"

  # ─── Food Entries ──────────────────────────────────────────
  /food-entries/within-bounds:
    get:
      summary: Fetch food entries within a bounding box
      description: >
        Food mode map view. Results are deduplicated by (eatery, food),
        keeping the highest-confidence entry.
      tags: [Food Entries]
      parameters:
        - name: minLat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: maxLat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: minLon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: maxLon
          in: query
          required: true
          schema: { type: number, format: double }
      responses:
        "200":
          description: List of food entries within bounds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodEntryMapItem"
        "400":
          description: Invalid bounds

  /food-entries/{foodEntryId}/details:
    get:
      summary: Fetch detailed information for a food entry
      description: Returns submitter details and metadata for the detail page.
      tags: [Food Entries]
      parameters:
        - name: foodEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Food entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntryDetail"
        "404":
          description: Not found

  /food-entries/historical-data/{foodEntryId}:
    get:
      summary: Fetch historical pricing data for a food entry
      description: Returns 90 days of price history with benchmark entries.
      tags: [Food Entries]
      parameters:
        - name: foodEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date-time }
          description: Start date for historical data (max 1 year ago)
      responses:
        "200":
          description: Historical pricing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodHistoricalData"
        "400":
          description: Invalid or future startDate

  /food-entries/submit:
    post:
      summary: Submit a new food entry (price report)
      tags: [Food Entries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEntrySubmissionRequest"
      headers:
        X-User-Id:
          schema: { type: string, format: uuid }
          required: true
      responses:
        "200":
          description: Successfully submitted

  /food-entries/{foodEntryId}/vote:
    post:
      summary: Vote on a food entry (upvote or downvote)
      description: >
        One vote per user per food entry (enforced by UK constraint + idempotency check).
        Self-voting is rejected. Publishes a WTF recalculation event on success.
      tags: [Food Entries]
      parameters:
        - name: foodEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Vote recorded
        "400":
          description: Self-vote or duplicate vote
        "404":
          description: Food entry not found

  # ─── Auth ──────────────────────────────────────────────────
  /auth/login:
    post:
      summary: Login with username/email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing credentials

  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "204":
          description: Registration successful

  /auth/google:
    post:
      summary: Login or register with Google OAuth (ID Token flow)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Login successful (new user auto-registered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid Google ID token
        "409":
          description: Email already registered with LOCAL auth

  # ─── Users ─────────────────────────────────────────────────
  /users/me:
    get:
      summary: Get current user profile
      tags: [Users]
      headers:
        X-User-Id:
          schema: { type: string, format: uuid }
          required: true
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

components:
  schemas:
    EateryMapItem:
      type: object
      properties:
        eateryId: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        typeLabel: { type: string }

    EateryDetail:
      type: object
      properties:
        eateryId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        typeLabel: { type: string }
        photoUrl: { type: string, format: uri }
        hasUserReported: { type: boolean, nullable: true, description: "null if no X-User-Id header" }
        foodPreviews:
          type: array
          items:
            $ref: "#/components/schemas/FoodPreview"

    EaterySearchResult:
      type: object
      properties:
        eateryId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }

    FoodPreview:
      type: object
      properties:
        foodEntryId: { type: string, format: uuid }
        name: { type: string }
        sgCents: { type: integer }
        upvotes: { type: integer }
        downvotes: { type: integer }
        photoPresignedUrl: { type: string }
        submitterId: { type: string, format: uuid }
        submitterUsername: { type: string }
        createdAt: { type: string, format: date-time }
        currentUserVote:
          type: boolean
          nullable: true
          description: null if not voted, true for upvote, false for downvote

    FoodSearchResult:
      type: object
      properties:
        foodId: { type: string, format: uuid }
        foodName: { type: string }
        photoUrl: { type: string }

    FoodEntryMapItem:
      type: object
      properties:
        foodEntryId: { type: string, format: uuid }
        foodName: { type: string }
        sgCents: { type: integer }
        eateryId: { type: string, format: uuid }
        eateryName: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    FoodEntryDetail:
      type: object
      properties:
        foodEntryId: { type: string, format: uuid }
        foodPhotoPresignedUrl: { type: string }
        submittedAt: { type: string, format: date-time }
        submitterId: { type: string, format: uuid }
        submitterUsername: { type: string }
        submitterProfilePhotoPresignedUrl: { type: string }
        submitterWtfScore: { type: number, format: double, nullable: true }
        submitterTenureDays: { type: integer, format: int64 }
        submitterEntriesSubmitted: { type: integer, format: int64 }

    FoodHistoricalData:
      type: object
      properties:
        foodName: { type: string }
        sgCentsConsensusPrice: { type: integer }
        eateryId: { type: string, format: uuid }
        eateryAddress: { type: string }
        submitterUsername: { type: string }
        datePrices:
          type: array
          items:
            $ref: "#/components/schemas/DatePriceItem"
        communityEntries:
          type: array
          items:
            $ref: "#/components/schemas/FoodPreview"
        consensusEntry:
          $ref: "#/components/schemas/FoodEntryDetail"

    DatePriceItem:
      type: object
      properties:
        date: { type: string, format: date-time }
        sgCents: { type: integer, nullable: true }
        confidence: { type: number, format: double, nullable: true }
        entryCount: { type: integer, nullable: true }

    FoodCreationRequest:
      type: object
      required: [foodName]
      properties:
        foodName:
          type: string
          maxLength: 100

    FoodEntrySubmissionRequest:
      type: object
      required: [eateryId, foodId, priceSgCents]
      properties:
        eateryId: { type: string, format: uuid }
        foodId: { type: string, format: uuid }
        priceSgCents: { type: integer }

    VoteRequest:
      type: object
      properties:
        isUpvote:
          type: boolean
          nullable: true
          description: true for upvote, false for downvote, null to retract

    OneMapEateryItem:
      type: object
      properties:
        name: { type: string }
        address: { type: string }

    EaterySearchCombinedResult:
      type: object
      properties:
        local:
          type: array
          items:
            $ref: "#/components/schemas/EaterySearchResult"
        onemap:
          type: array
          items:
            $ref: "#/components/schemas/OneMapEateryItem"

    EateryType:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }

    CreateEateryRequest:
      type: object
      required: [name, address, typeId]
      properties:
        name: { type: string }
        address: { type: string }
        typeId: { type: string, format: uuid }

    LoginRequest:
      type: object
      required: [usernameOrEmail, password]
      properties:
        usernameOrEmail: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        jwt: { type: string }

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password: { type: string }

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }
        description: Google ID token from the frontend OAuth ID Token flow

    MeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        avatarUrl: { type: string, nullable: true }
